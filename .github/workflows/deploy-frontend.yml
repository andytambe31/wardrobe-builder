name: Frontend (web/ → S3/CloudFront)

# Builds the web app in web/ and publishes it to the env's private S3 bucket
# behind CloudFront.
#
#   • web/package.json present → `npm ci && npm run build`, publish web/dist
#     (any bundler works: Vite, Next static export, ... — just emit to dist/).
#   • no package.json          → publish web/ as plain static files.
#
# The build is environment-agnostic: the deploy writes config.js (Cognito +
# API URL from Terraform outputs) into the published site, and the app reads
# window.__WARDROBE_CONFIG__ at runtime. One build, any env, no account values
# in git.
#
# PRs touching web/ run the build only (no AWS). Deploys are manual:
# Actions → Frontend → Run workflow → pick env. Keyless via the GitHub OIDC
# deploy role (runs from main, matching the role's trust policy).

on:
  pull_request:
    paths: ["web/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy the frontend for
        required: true
        default: prod
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.8

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish_dir: ${{ steps.build.outputs.publish_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        id: build
        working-directory: web
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci
            # Lint/tests run here too when the app defines them.
            npm run --if-present lint
            npm run --if-present test
            npm run build
            DIR=web/dist
          else
            DIR=web
          fi
          test -f "$GITHUB_WORKSPACE/$DIR/index.html" || { echo "::error::$DIR/index.html missing"; exit 1; }
          echo "publish_dir=$DIR" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ steps.build.outputs.publish_dir }}
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Pull the env's outputs from Terraform state (needs backend access only).
      - name: Terraform init (read outputs)
        working-directory: infra/envs/${{ inputs.env }}
        run: |
          cat > backend.hcl <<HCL
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "wardrobe-builder/${{ inputs.env }}/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          HCL
          terraform init -backend-config=backend.hcl

      - name: Read outputs → write config.js
        working-directory: infra/envs/${{ inputs.env }}
        run: |
          set -euo pipefail
          BUCKET=$(terraform output -raw frontend_bucket)
          DIST=$(terraform output -raw frontend_distribution_id)
          DOMAIN=$(terraform output -raw frontend_domain)
          REGION=$(terraform output -raw cognito_region)
          POOL=$(terraform output -raw cognito_user_pool_id)
          CLIENT=$(terraform output -raw cognito_client_id)
          COGNITO_DOMAIN=$(terraform output -raw cognito_hosted_ui_domain)
          API=$(terraform output -raw api_endpoint)
          {
            echo "BUCKET=$BUCKET"
            echo "DIST=$DIST"
            echo "DOMAIN=$DOMAIN"
          } >> "$GITHUB_ENV"
          cat > "$GITHUB_WORKSPACE/site/config.js" <<CFG
          window.__WARDROBE_CONFIG__ = {
            env: "${{ inputs.env }}",
            cognito: { region: "$REGION", userPoolId: "$POOL", clientId: "$CLIENT", domain: "$COGNITO_DOMAIN" },
            apiBaseUrl: "$API"
          };
          CFG
          echo "Generated config.js for ${{ inputs.env }} (bucket=$BUCKET, dist=$DIST)"

      # Two cache policies:
      #   assets/  — content-hashed bundler output (Vite's default dir): cache
      #              for a year. Never --delete'd, so a tab still running the
      #              previous build can lazy-load its old chunks after a deploy.
      #   the rest — index.html, config.js, manifest, service worker: no-cache,
      #              i.e. browsers revalidate every time (cheap 304 when
      #              unchanged), so a deploy is picked up on the next load.
      - name: Sync to S3
        working-directory: site
        run: |
          set -euo pipefail
          if [ -d assets ]; then
            aws s3 sync assets "s3://$BUCKET/assets" \
              --cache-control "public, max-age=31536000, immutable"
          fi
          aws s3 sync . "s3://$BUCKET" --delete \
            --exclude "assets/*" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$ID"

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null "https://$DOMAIN/"
          curl -fsS "https://$DOMAIN/config.js" | grep -q "__WARDROBE_CONFIG__"
          echo "live: https://$DOMAIN/"
