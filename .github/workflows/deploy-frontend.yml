name: Frontend

# PRs touching web/ build the app (and run its lint/test scripts) — no AWS.
# Manual deploy: Actions → Frontend → Run workflow → pick env. Merges to main
# deploy automatically through deploy-main.yml; this is for redeploying by hand.
# The steps live in _frontend-deploy.yml.

on:
  pull_request:
    paths: ["web/**", ".github/workflows/deploy-frontend.yml", ".github/workflows/_frontend-deploy.yml"]
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy the frontend for
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci
            npm run --if-present lint
            npm run --if-present test
            npm run build
            test -f dist/index.html || { echo "::error::web/dist/index.html missing after build"; exit 1; }
          else
            test -f index.html || { echo "::error::web/index.html missing"; exit 1; }
          fi

  deploy:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_frontend-deploy.yml
    with:
      env: ${{ inputs.env }}
