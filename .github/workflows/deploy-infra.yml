name: Terraform (infra)

# Keyless AWS auth via GitHub OIDC — no static credentials in GitHub.
# The role is created by infra/bootstrap; set these repo Variables
# (Settings → Secrets and variables → Actions → Variables):
#   AWS_ROLE_ARN     the CI role ARN from bootstrap output
#   TF_STATE_BUCKET  the state bucket from bootstrap output
#   TF_LOCK_TABLE    the lock table from bootstrap output (default wardrobe-builder-tf-locks)
#   ALERT_EMAIL      your email — used for alert subscription AND the allow-list
#   ALLOWED_SUBS     (optional) your Cognito sub, for the allow-list
#
# The deploy role's trust policy only allows main, so PRs can't (and shouldn't)
# assume it. PR checks therefore run WITHOUT AWS (API tests, fmt, validate).
# Merges to main deploy automatically through deploy-main.yml; the manual run
# here is for re-applying by hand, or for approving a plan that deletes or
# replaces resources (allow_destroy). The steps live in _terraform-apply.yml.

on:
  pull_request:
    paths: ["infra/**", "services/api/**", ".github/workflows/deploy-infra.yml", ".github/workflows/_terraform-apply.yml"]
  workflow_dispatch:
    inputs:
      env:
        description: Environment to apply
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      allow_destroy:
        description: Apply even if the plan deletes or replaces resources
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_VERSION: 1.9.8

jobs:
  # API unit tests — no AWS, no network (in-memory data layer + local JWT keys).
  api-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; fi
      - run: npm test

  # Proves the config is well-formed and formatted — no AWS needed.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format check (advisory)
        continue-on-error: true
        run: terraform fmt -check -recursive ../../
      - name: Init (no backend — no AWS needed)
        run: terraform init -backend=false
      - run: terraform validate

  apply:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      env: ${{ inputs.env }}
      allow_destroy: ${{ inputs.allow_destroy }}
